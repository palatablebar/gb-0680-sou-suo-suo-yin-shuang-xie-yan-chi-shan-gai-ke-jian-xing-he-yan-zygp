name: indexparity
services:
  app:
    build: .
    ports:
      - "${APP_PORT:-18249}:8000"
    environment:
      DATA_DIR: /data
    volumes:
      - records:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  records:
